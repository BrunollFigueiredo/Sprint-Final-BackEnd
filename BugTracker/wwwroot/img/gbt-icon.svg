<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="48" height="48" rx="12" fill="url(#bg)"/>
  <!-- Antennae -->
  <line x1="18" y1="15" x2="13" y2="7" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="12" cy="6" r="2.2" fill="white"/>
  <line x1="30" y1="15" x2="35" y2="7" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="36" cy="6" r="2.2" fill="white"/>
  <!-- Controller body (bug body) -->
  <rect x="8" y="16" width="32" height="18" rx="9" fill="white"/>
  <!-- D-pad (left side) -->
  <rect x="14" y="23" width="7" height="2.5" rx="1.2" fill="#0891b2"/>
  <rect x="16.75" y="20.25" width="2.5" height="7" rx="1.2" fill="#0891b2"/>
  <!-- Face buttons (right side) -->
  <circle cx="32" cy="22" r="2.2" fill="#0891b2"/>
  <circle cx="36" cy="25" r="1.6" fill="#0891b2" opacity="0.55"/>
  <circle cx="28.5" cy="25" r="1.6" fill="#0891b2" opacity="0.55"/>
  <!-- Legs left -->
  <line x1="10" y1="21" x2="3"  y2="18" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="10" y1="27" x2="3"  y2="27" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="10" y1="33" x2="3"  y2="36" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Legs right -->
  <line x1="38" y1="21" x2="45" y2="18" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="27" x2="45" y2="27" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="33" x2="45" y2="36" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
