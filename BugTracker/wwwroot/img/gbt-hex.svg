<svg viewBox="0 0 80 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hbg" x1="75" y1="2" x2="5" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0077a8"/>
    </linearGradient>
  </defs>

  <!-- Base hexagon -->
  <polygon points="40,2 75,21 75,51 40,70 5,51 5,21" fill="url(#hbg)"/>

  <!-- 3D facet shading from center (40,36) -->
  <polygon points="40,36 5,21 40,2"  fill="rgba(255,255,255,0.20)"/>
  <polygon points="40,36 40,2 75,21" fill="rgba(255,255,255,0.08)"/>
  <polygon points="40,36 5,51 5,21"  fill="rgba(255,255,255,0.04)"/>
  <polygon points="40,36 75,21 75,51" fill="rgba(0,0,0,0.06)"/>
  <polygon points="40,36 40,70 5,51"  fill="rgba(0,0,0,0.12)"/>
  <polygon points="40,36 75,51 40,70" fill="rgba(0,0,0,0.18)"/>

  <!-- Inner bevel ring -->
  <polygon points="40,8 69,24.5 69,47.5 40,64 11,47.5 11,24.5"
           fill="none" stroke="rgba(255,255,255,0.20)" stroke-width="1.5"/>
  <!-- Extra top-edge highlight -->
  <polyline points="11,24.5 40,8 69,24.5"
            fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Antennae -->
  <line x1="32" y1="24" x2="27" y2="16.5" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="26.5" cy="15" r="2.2" fill="white"/>
  <line x1="48" y1="24" x2="53" y2="16.5" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="53.5" cy="15" r="2.2" fill="white"/>

  <!-- Controller body -->
  <rect x="19" y="25" width="42" height="22" rx="11" fill="white"/>

  <!-- D-pad -->
  <rect x="25" y="33" width="9" height="2.5" rx="1.2" fill="#0891b2"/>
  <rect x="28" y="29.75" width="2.5" height="9" rx="1.2" fill="#0891b2"/>

  <!-- Face buttons (4 — diamond layout) -->
  <circle cx="53"   cy="31"   r="2.3" fill="#0891b2"/>
  <circle cx="57.5" cy="35"   r="1.9" fill="#0891b2" opacity="0.60"/>
  <circle cx="48.5" cy="35"   r="1.9" fill="#0891b2" opacity="0.60"/>
  <circle cx="53"   cy="38.5" r="1.7" fill="#0891b2" opacity="0.40"/>

  <!-- Legs left -->
  <line x1="21" y1="31" x2="13" y2="27" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="21" y1="38" x2="13" y2="38" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="21" y1="45" x2="13" y2="49" stroke="white" stroke-width="2" stroke-linecap="round"/>

  <!-- Legs right -->
  <line x1="59" y1="31" x2="67" y2="27" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="59" y1="38" x2="67" y2="38" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="59" y1="45" x2="67" y2="49" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
